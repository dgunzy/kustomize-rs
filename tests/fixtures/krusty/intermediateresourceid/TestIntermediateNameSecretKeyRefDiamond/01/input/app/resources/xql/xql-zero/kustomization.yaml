
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: xql-zero-
resources:
- ../../../../bases/xql
secretGenerator:
- name: xql-secret
  behavior: merge
  envs:
  - config/xql-zero-secret.env
vars:
- name: PROJECT_XQL_ZERO_SECRET_NAME
  objref:
    kind: Secret
    name: xql-secret
    apiVersion: v1
  fieldref:
    fieldpath: metadata.name
