
apiVersion: apps/v1beta1
kind: StatefulSet
metadata:
  name: cockroachdb
spec:
  template:
    spec:
      containers:
      - name: cockroachdb
        image: cockroachdb/cockroach:v1.1.5
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8888
          name: http
