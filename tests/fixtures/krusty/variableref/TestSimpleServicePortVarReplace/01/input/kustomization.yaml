
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- service.yaml
- statefulset.yaml
vars:
 - name: THE_PORT
   objref:
     kind: StatefulSet
     name: cockroachdb
     apiVersion: apps/v1beta1
   fieldref:
     fieldpath: spec.template.spec.containers[0].ports[1].containerPort
