
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- mycrd.yaml
openapi:
  path: https://github.com/kubernetes-sigs/kustomize/raw/master/api/krusty/testdata/customschema.json

patchesStrategicMerge:
- |-
  apiVersion: example.com/v1alpha1
  kind: MyCRD
  metadata:
    name: service
  spec:
    template:
      spec:
        containers:
        - name: server
          image: nginx
