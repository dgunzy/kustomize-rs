
apiVersion: local/v1
kind: IngressHost
metadata:
  name: test.fakedomain.com
  namespace: test
  annotations:
    config.kubernetes.io/local-config: "true"
---
apiVersion: local/v1
kind: IngressSecret
metadata:
  name: test-secret
  namespace: test
  annotations:
    config.kubernetes.io/local-config: "true"
---
apiVersion: v1
kind: Ingress
metadata:
  name: test-ingress
  namespace: test
spec:
  rules:
  - host: test.fakedomain.com
  - host: do-not-touch.otherdomain.com
  tls:
  - hosts:
    - test.fakedomain.com
    secretName: test-secret
  - hosts:
    - do-not-touch.otherdomain.com
    secretname: do-not-touch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  namespace: test
spec:
  template:
    spec:
      containers:
      - name: tester
        env:
        - name: domain-name
          value: test.fakedomain.com
