apiVersion: v1
kind: Pod
metadata:
  name: pod
spec:
  volumes:
  - image:
      reference: nginx:v2
    name: volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy
spec:
  template:
    spec:
      volumes:
      - image:
          reference: nginx:v2
        name: volume
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob
spec:
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - image:
              reference: nginx:v2
            name: volume
