
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- app1.yaml
- app2.yaml
- cm1.yaml
- cm2.yaml
- pg1.yaml

replacements:
  - source:
      kind: ConfigMap
      name: cm1
    targets:
      - reject:
          - kind: ConfigMap
            name: c.1
        select:
          kind: Deployment|ConfigMap|postgresql
        fieldPaths:
          - metadata.annotations.visitedby
        options:
          index: -1
          delimiter: ","
          create: true
  - source:
      kind: ConfigMap
      name: cm2
    targets:
      - reject:
          - kind: ConfigMap
            name: .*2
        select:
          kind: Deployment|ConfigMap|postgresql
        fieldPaths:
          - metadata.annotations.visitedby
        options:
          index: -1
          delimiter: ","
          create: true
