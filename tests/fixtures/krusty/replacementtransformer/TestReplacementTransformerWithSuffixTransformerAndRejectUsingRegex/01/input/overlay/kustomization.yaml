
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -dev
namePrefix: pre-
resources:
  - ../base

configMapGenerator:
  - name: app-config
    literals:
      - name=something-else

replacements:
- source:
    kind: ConfigMap
    name: app-config
    fieldPath: data.name
  targets:
    - reject:
        - name: .*original.*
      select:
        kind: Deployment
      fieldPaths:
        - spec.template.spec.containers.0.name
    - select:
        kind: ConfigMap
        name: app-config
      fieldPaths:
        - data.name-copy
      options:
        create: true
