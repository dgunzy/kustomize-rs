id = "W-namespace"
title = "namespace transformer"
status = "todo"
owner = "worker"
difficulty = 3
order = 130
depends_on = ["L-fieldspec"]
summary = '''
Implement `namespace:` with the NamespaceTransformer: set namespaces at the `namespace.yaml` field specs, plus the upstream special cases (RoleBinding/ClusterRoleBinding subjects for the default ServiceAccount, cluster-scoped kinds left alone).
'''

[context]
upstream = [
  "kustomize:api/filters/namespace/namespace.go",
  "kustomize:api/internal/builtins/NamespaceTransformer.go#Transform"
]
read = ["src/fieldspec.rs", "src/transformers/mod.rs", "src/resource.rs", "src/setters.rs", "src/config.rs"]
units = ["namespace_filter"]
cases = ["namespaces/", "namespacepropagation/"]
max_examples = 2
budget = 14000

[scope]
write = ["src/transformers/namespace.rs", "src/transformers/mod.rs", "src/kustomization.rs", "src/build.rs"]

[accept]
tests = ["transformers::namespace::", "upstream_namespace"]
cases = []
min_new_passes = 2
